services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okak}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-okak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      OKAK_APP__CORS_ORIGINS: '["http://localhost:3000"]'
      OKAK_POSTGRES__HOST: postgres
      OKAK_POSTGRES__PORT: 5432
      OKAK_POSTGRES__USER: ${POSTGRES_USER:-postgres}
      OKAK_POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      OKAK_POSTGRES__DATABASE: ${POSTGRES_DB:-okak}
      OKAK_AUTH__SECRET_KEY: ${OKAK_AUTH__SECRET_KEY:-change-me-in-production}
      OKAK_UPLOADS__UPLOADS_DIR: /app/uploads
      OKAK_LLM__PROVIDER: ${OKAK_LLM__PROVIDER:-gigachat}
      OKAK_LLM__OPENAI_API_KEY: ${OKAK_LLM__OPENAI_API_KEY:-}
      OKAK_LLM__QWEN_API_KEY: ${OKAK_LLM__QWEN_API_KEY:-}
      OKAK_LLM__GIGACHAT_AUTH_KEY: ${OKAK_LLM__GIGACHAT_AUTH_KEY:-}
      OKAK_LLM__GIGACHAT_SCOPE: ${OKAK_LLM__GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      OKAK_LLM__GIGACHAT_MODEL: ${OKAK_LLM__GIGACHAT_MODEL:-GigaChat}
      OKAK_LLM__GIGACHAT_BASE_URL: ${OKAK_LLM__GIGACHAT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      OKAK_LLM__GIGACHAT_AUTH_URL: ${OKAK_LLM__GIGACHAT_AUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      OKAK_LLM__GIGACHAT_IMAGE_MODEL: ${OKAK_LLM__GIGACHAT_IMAGE_MODEL:-GigaChat}
      OKAK_LLM__GIGACHAT_VERIFY_SSL_CERTS: ${OKAK_LLM__GIGACHAT_VERIFY_SSL_CERTS:-true}
    command: >
      sh -c "alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
