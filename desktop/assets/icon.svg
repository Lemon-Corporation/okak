<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="256" height="256" rx="72" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#inner)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <circle cx="70" cy="72" r="36" fill="url(#limeGlow)" opacity="0.55"/>
  <circle cx="198" cy="194" r="40" fill="url(#cyanGlow)" opacity="0.22"/>

  <g filter="url(#shadow)">
    <rect x="84" y="94" width="16" height="56" rx="8" fill="url(#bar)"/>
    <rect x="108" y="76" width="16" height="92" rx="8" fill="url(#bar)"/>
    <rect x="132" y="60" width="16" height="124" rx="8" fill="url(#bar)"/>
    <rect x="156" y="86" width="16" height="72" rx="8" fill="url(#bar)"/>
  </g>

  <defs>
    <linearGradient id="bg" x1="36" y1="20" x2="214" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D3BFF"/>
      <stop offset="1" stop-color="#2432B8"/>
    </linearGradient>
    <linearGradient id="inner" x1="128" y1="8" x2="128" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <linearGradient id="bar" x1="128" y1="60" x2="128" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B7FF3A"/>
    </linearGradient>
    <radialGradient id="limeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 72) rotate(90) scale(36)">
      <stop stop-color="#B7FF3A"/>
      <stop offset="1" stop-color="#B7FF3A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(198 194) rotate(90) scale(40)">
      <stop stop-color="#7EE7FF"/>
      <stop offset="1" stop-color="#7EE7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="70" y="46" width="116" height="152" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#C0FF4C" flood-opacity="0.16"/>
    </filter>
  </defs>
</svg>
